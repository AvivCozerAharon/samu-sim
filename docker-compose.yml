x-servico: &servico
  build: .
  environment: &env
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_REGION: us-east-1
    N_WORKERS: "2"
    LOG_DIR: /logs
    FATOR: ${FATOR:-20}
    POLITICA: ${POLITICA:-mais_proxima}
    N_AMBULANCIAS: ${N_AMBULANCIAS:-50}
    CHAMADOS_POR_DIA: ${CHAMADOS_POR_DIA:-300}
    SEED: ${SEED:-42}
    RODADA_ID: ${RODADA_ID:-local}
    ROTEADOR: ${ROTEADOR:-haversine}
    OSRM_URL: http://osrm:5000
  volumes:
    - ./logs:/logs
  depends_on:
    bootstrap:
      condition: service_completed_successfully

services:
  localstack:
    image: localstack/localstack:3
    ports: ["4566:4566"]
    environment:
      - SERVICES=sqs,dynamodb
      - EAGER_SERVICE_LOADING=1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  bootstrap:
    build: .
    environment: *env
    command: python -m samu_sim.infra.bootstrap
    depends_on:
      localstack:
        condition: service_healthy

  gerador:
    <<: *servico
    command: python -m samu_sim.gerador

  despachante:
    <<: *servico
    command: python -m samu_sim.despachante
    deploy:
      replicas: 2

  ambulancia-w0:
    <<: *servico
    command: python -m samu_sim.ambulancia
    environment:
      <<: *env
      WORKER_ID: w0

  ambulancia-w1:
    <<: *servico
    command: python -m samu_sim.ambulancia
    environment:
      <<: *env
      WORKER_ID: w1

  api:
    <<: *servico
    command: python -m samu_sim.api
    ports: ["8000:8000"]

  # opcional (so local): docker compose --profile osrm up -d osrm
  # exige dados/osrm/ preparado por scripts/preparar_osrm.sh
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/rio.osrm
    volumes:
      - ./dados/osrm:/data
    ports: ["5000:5000"]
    # a imagem nao tem wget/curl: healthcheck via /dev/tcp do bash
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
